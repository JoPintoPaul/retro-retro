  button, input, textarea { font: inherit; }

  .desktop-label {
    position: fixed; left: 12px; bottom: 12px; color: white;
    text-shadow: 1px 1px #333; font-size: 12px;
  }
  .window {
    width: min(760px, 100%);
    margin: 0 auto;
    background: var(--chrome);
    border: 2px solid;
    border-color: var(--white) var(--dark-shadow) var(--dark-shadow) var(--white);
    box-shadow: 1px 1px 0 #000;
    padding: 3px;
  }
  .titlebar {
    min-height: 30px; padding: 4px 6px;
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; color: white; background: var(--navy);
    font-weight: bold;
  }
  .titlebar-name { display: flex; align-items: center; gap: 8px; }
  .app-icon {
    width: 18px; height: 18px; display: inline-grid; place-items: center;
    background: #c0c0c0; color: #000; border: 1px solid #fff;
    font-size: 12px; line-height: 1;
  }
  .window-controls { display: flex; gap: 3px; }
  .win-control {
    width: 21px; height: 20px; padding: 0; line-height: 15px;
    font-weight: bold; background: var(--chrome); border: 2px solid;
    border-color: var(--white) var(--dark-shadow) var(--dark-shadow) var(--white);
  }
  .menubar { display: flex; gap: 18px; padding: 7px 8px; font-size: 13px; }
  .content {
    background: #fff; border: 2px solid;
    border-color: var(--dark-shadow) var(--white) var(--white) var(--dark-shadow);
    padding: clamp(16px, 4vw, 28px);
    min-height: 390px;
  }
  .progress-wrap { margin: 0 0 22px; }
  .progress-meta {
    display: flex; justify-content: space-between; gap: 12px;
    margin-bottom: 7px; font-size: 12px;
  }
  .progress-track {
    height: 15px; padding: 2px; background: white;
    border: 1px solid var(--shadow);
    box-shadow: inset 1px 1px 0 var(--dark-shadow);
    display: flex; gap: 2px;
  }
  .progress-segment { flex: 1; background: #eee; }
  .progress-segment.done { background: #000080; }
  .page-kicker { color: #555; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  h1 { margin: 7px 0 12px; color: var(--navy); font-size: clamp(23px, 4vw, 30px); }
  .prompt { margin: 0 0 20px; line-height: 1.5; }
  .dialog {
    max-width: 590px; margin: 20px auto 0; background: var(--chrome);
    border: 2px solid; border-color: var(--white) var(--dark-shadow) var(--dark-shadow) var(--white);
    padding: 3px;
  }
  .dialog-title {
    background: var(--navy); color: white; font-weight: bold;
    padding: 6px 8px; display: flex; align-items: center; justify-content: space-between;
  }
  .dialog-body { padding: 17px 16px 14px; }
  .dialog-question { display: flex; align-items: center; gap: 13px; margin-bottom: 14px; }
  .dialog-symbol {
    flex: 0 0 42px; width: 42px; height: 42px; display: grid; place-items: center;
    border-radius: 50%; background: #e00000; color: white; font-size: 28px;
    font-family: Georgia, serif; font-weight: bold; border: 2px solid #800000;
    text-shadow: 1px 1px #700;
  }
  .dialog-symbol.good { background: #16852a; border-color: #075c18; }
  .dialog-symbol.info { background: #000080; border-color: #00004d; }
  .dialog-symbol.power { background: #e7e7e7; color: #000080; border-color: #777; }
  .dialog-symbol.warning {
    background: #ffd83d;
    color: #111;
    border: 2px solid #9b6b00;
    border-radius: 0;
    clip-path: polygon(50% 0, 100% 92%, 0 92%);
    padding-top: 10px;
    text-shadow: none;
  }
  .dialog-question h2 { margin: 0; font-size: 19px; line-height: 1.25; }
  textarea, input[type="text"] {
    display: block; width: 100%; border: 2px solid;
    border-color: var(--dark-shadow) var(--white) var(--white) var(--dark-shadow);
    background: white; padding: 9px; min-height: 112px; resize: vertical;
    outline: none; color: #111;
  }
  input[type="text"] { min-height: 38px; }
  textarea:focus, input:focus { outline: 1px dotted #000; outline-offset: -5px; }

  .field-label { display: block; margin: 13px 0 6px; font-weight: bold; font-size: 12px; }
  .actions-list { display: grid; gap: 12px; }
  .action-entry { background: #eee; border: 1px solid #999; padding: 10px; }
  .action-entry label { display: block; margin-bottom: 6px; font-weight: bold; font-size: 12px; }
  .action-entry input { background: #fff; }
  .hint { color: #555; font-size: 12px; margin: 10px 0 0; }
  .nav-row {
    display: flex; justify-content: space-between; align-items: center;
    gap: 10px; margin-top: 24px; flex-wrap: wrap;
  }
  .button-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .win-button {
    min-width: 88px; padding: 7px 14px; background: var(--chrome);
    border: 2px solid; border-color: var(--white) var(--dark-shadow) var(--dark-shadow) var(--white);
    color: #000; cursor: pointer;
  }
  .win-button:active {
    border-color: var(--dark-shadow) var(--white) var(--white) var(--dark-shadow);
    padding: 8px 13px 6px 15px;
  }
  .win-button:focus { outline: 1px dotted #000; outline-offset: -5px; }
  .win-button.primary { font-weight: bold; }
  .win-button:disabled { color: #777; cursor: not-allowed; }
  .statusbar {
    display: flex; justify-content: space-between; gap: 10px;
    margin-top: 5px; padding: 5px 7px; font-size: 11px;
  }
  .status-cell {
    border: 1px solid; border-color: var(--shadow) var(--white) var(--white) var(--shadow);
    padding: 4px 7px; flex: 1;
  }
  .report h2 { color: var(--navy); border-bottom: 1px solid #999; padding-bottom: 6px; }
  .report-section { margin: 20px 0; }
  .report-section h3 { margin: 0 0 7px; color: #000080; }
  .report-section p { white-space: pre-wrap; line-height: 1.5; margin: 0; }
  .report-actions { padding-left: 22px; }
  .report-actions li { margin: 7px 0; }
  .empty { color: #777; font-style: italic; }
  .report-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
  .small-note { font-size: 11px; color: #555; }
  @media (max-width: 520px) {
    body { padding: 10px 8px 48px; }
    .content { min-height: 0; padding: 16px 12px; }
    .dialog-body { padding: 13px 10px 11px; }
    .dialog-question h2 { font-size: 17px; }
    .statusbar { flex-direction: column; }
  }

  /* Windows XP Luna-inspired skin */
  :root {
    --chrome: #ece9d8;
    --navy: #1559b5;
    --shadow: #aca899;
    --dark-shadow: #716f64;
    --highlight: #ffffff;
  }
  body {
    font-family: Tahoma, Verdana, sans-serif;
    font-size: 13px;
  }
  .window {
    background: #ece9d8;
    border: 1px solid #0b3f8f;
    border-radius: 8px 8px 4px 4px;
    padding: 4px;
    box-shadow: 0 5px 18px rgba(0,0,0,.35);
    overflow: hidden;
  }
  .titlebar {
    min-height: 34px;
    padding: 6px 8px 7px 10px;
    border-radius: 5px 5px 0 0;
    background: linear-gradient(180deg, #3b8cf4 0%, #1769d2 18%, #0752b8 55%, #0c3f9b 100%);
    text-shadow: 1px 1px 2px #123c79;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.65);
  }
  .app-icon {
    border: 1px solid #dceaff;
    border-radius: 3px;
    box-shadow: 0 1px 2px rgba(0,0,0,.35);
  }
  .window-controls { gap: 2px; }
  .win-control {
    width: 23px;
    height: 22px;
    border: 1px solid #fff;
    border-radius: 4px;
    color: white;
    background: linear-gradient(180deg, #7eb7f7, #2368c9 55%, #12479e);
    box-shadow: inset 0 1px 1px rgba(255,255,255,.7), 0 1px 1px rgba(0,0,0,.25);
    text-shadow: 0 1px #17488b;
  }
  .win-control:last-child {
    background: linear-gradient(180deg, #f5a08f, #e34b35 55%, #b51d16);
  }
  .menubar {
    padding: 8px 10px;
    background: #ece9d8;
    color: #222;
    border-bottom: 1px solid #c9c6b8;
  }
  .content {
    background: #fff;
    border: 1px solid #9c9a8c;
    border-radius: 3px;

  /* Windows XP desktop shortcut / launch screen */

<script>
(() => {
  const STORAGE_KEY = "retroManagerRetrospective_v1";
  const pages = [
    {
      id: "error-message",
      windowTitle: "System Information",
      title: "System Info",
      question: "If you had to describe how we worked as a team in the last month, how would you describe us?",
      placeholder: "Describe how the team worked...",
      symbol: "!",
      symbolClass: "warning"
    },
    {
      id: "successful-downloads",
      windowTitle: "Download Complete",
      title: "Successful Downloads",
      question: "What went well over the last month? What did we achieve?",
      placeholder: "List your successes here...",
      symbol: "✓",
      symbolClass: "good"
    },
    {
      id: "system-errors",
      windowTitle: "Application Error",
      title: "System Errors",
      question: "What went wrong? What caused frustration?",
      placeholder: "Describe the errors here...",
      symbol: "×",
      symbolClass: ""
    },
    {
      id: "system-upgrades",
      windowTitle: "Windows Update",
      title: "System Upgrades",
      question: "What could we improve? What processes need an upgrade?",
      placeholder: "Suggest your upgrades here...",
      symbol: "⚙",
      symbolClass: "info"
    },
    {
      id: "next-version",
      windowTitle: "Software Update Wizard",
      title: "Retro Manager 26",
      question: "What are some specific actions before the end of 2026?",
      type: "actions",
      symbol: "▣",
      symbolClass: "info"

    {
      id: "retro-manager-27",
      windowTitle: "Software Update Wizard",
      title: "Retro Manager 27",
      question: "What are some specific actions to kick off when we come back in 2027?",
      type: "actions",
      symbol: "▣",
      symbolClass: "info"

      id: "shut-down",

      title: "Shut Down",

      symbolClass: "power"

    "retro-manager-27": ["", "", ""],

  let answers = blankAnswers();

  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");

    return String(value).replace(/[&<>"']/g, ch => ({

      ${progressMarkup(currentPage)}
      <div class="page-kicker">Retrospective · ${String(currentPage + 1).padStart(2, "0")}</div>
      <section class="dialog" aria-labelledby="page-title">
        <div class="dialog-title"><span>${page.windowTitle}</span><span aria-hidden="true">×</span></div>
        <div class="dialog-body">
          <div class="dialog-question">
            <div class="dialog-symbol ${page.symbolClass}" aria-hidden="true">${page.symbol}</div>
            <h2 id="page-title">${page.title}</h2>
          </div>
          <p class="prompt">${page.question}</p>
          <div class="input-column">
              ${page.type === "actions" ? renderActions(page) : `
                <label class="field-label" for="answer-field">YOUR RESPONSE</label>
                <textarea id="answer-field" placeholder="${page.placeholder}">${escapeHtml(answers[page.id] || "")}</textarea>
              `}
              ${page.type === "actions" ? '<p class="hint">Add up to three actions. You can leave any field blank.</p>' : '<p class="hint">Put each item on a new line. Your response is saved automatically in this browser.</p>'}
          </div>
        </div>
      </section>
      <div class="nav-row">
        <button class="win-button" id="back-button" ${currentPage === 0 ? "disabled" : ""}>‹ Back</button>
        <div class="button-row">
          <button class="win-button" id="clear-page">Clear page</button>
          <button class="win-button primary" id="next-button">${currentPage === pages.length - 1 ? "View report »" : "Next »"}</button>
        </div>
      </div>
    `;

    if (page.type === "actions") {
      document.querySelectorAll("[data-action-index]").forEach(input => {
        input.addEventListener("input", event => {
          answers[page.id][Number(event.target.dataset.actionIndex)] = event.target.value;
          save();
        });
      });
    } else {
      document.getElementById("answer-field").addEventListener("input", event => {
        answers[page.id] = event.target.value;
        save();
      });
    }

    document.getElementById("back-button").addEventListener("click", () => {
      if (currentPage > 0) { currentPage--; renderPage(); }
    });
    document.getElementById("next-button").addEventListener("click", () => {
      save();
      if (currentPage === 3) { showClippyPrompt(); }
      else if (currentPage < pages.length - 1) { currentPage++; renderPage(); }
      else renderReport();
    });
    document.getElementById("clear-page").addEventListener("click", () => {
      if (!confirm("Clear the responses on this page?")) return;
      if (page.type === "actions") answers[page.id] = ["", "", ""];
      else answers[page.id] = "";
      save();
      renderPage();
    });
  }

  function renderActions(page) {
    return `<div class="actions-list">
      ${[0,1,2].map(i => `
        <div class="action-entry">
          <label for="action-${i}">ACTION ${i + 1}</label>
          <input type="text" id="action-${i}" data-action-index="${i}" maxlength="240"
            placeholder="Enter action..." value="${escapeHtml(answers[page.id][i])}">
        </div>`).join("")}
    </div>`;
  }

  function renderReport() {
    save();
    statusLeft.textContent = "Retrospective report";
    const sections = pages.map(page => {
      let body;
      if (page.type === "actions") {
        const items = answers[page.id].map(s => s.trim()).filter(Boolean);
        body = items.length
          ? `<ol class="report-actions">${items.map(item => `<li>${escapeHtml(item)}</li>`).join("")}</ol>`
          : '<p class="empty">No actions entered.</p>';
      } else {
        const value = (answers[page.id] || "").trim();
        body = value ? `<p>${escapeHtml(value)}</p>` : '<p class="empty">No response entered.</p>';
      }
      return `<section class="report-section"><h3>${page.title}</h3>${body}</section>`;
    }).join("") + (answers["team-thanks"].trim()
      ? `<section class="report-section"><h3>Team Thanks</h3><p>${escapeHtml(answers["team-thanks"].trim())}</p></section>`
      : "");

    app.innerHTML = `
      ${progressMarkup(pages.length)}
      <div class="report">
        <div class="report-top">
          <div><div class="page-kicker">RETRO MANAGER · SUMMARY</div><h1>Retrospective Report</h1>
          <p class="small-note">Generated ${new Date().toLocaleString()}</p></div>
          <div class="button-row">
            <button class="win-button" id="edit-answers">‹ Edit answers</button>
            <button class="win-button" id="copy-report">Copy to clipboard</button>
          </div>
        </div>
        ${sections}
        <div class="nav-row">
          <button class="win-button" id="start-over">Start again</button>
          <span class="small-note">Your responses remain saved in this browser until cleared.</span>
        </div>
      </div>`;

    document.getElementById("edit-answers").addEventListener("click", () => {
      currentPage = 0;
      renderPage();
    });
    document.getElementById("copy-report").addEventListener("click", async event => {
      const lines = [];
      pages.forEach(page => {
        let items;
        if (page.type === "actions") {
          items = answers[page.id].map(value => value.trim()).filter(Boolean);
        } else {
          items = (answers[page.id] || "")
            .split(/\r?\n/)
            .map(value => value.trim())
            .filter(Boolean);
        }
        items.forEach(item => lines.push(`${page.title}: ${item}`));
      });
      (answers["team-thanks"] || "").split(/\r?\n/).map(value => value.trim()).filter(Boolean)
        .forEach(item => lines.push(`Team Thanks: ${item}`));
      const textToCopy = lines.join("\n\n");

      const button = event.currentTarget;
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(textToCopy);
        } else {
          const temporary = document.createElement("textarea");
          temporary.value = textToCopy;
          temporary.setAttribute("readonly", "");
          temporary.style.position = "fixed";
          temporary.style.opacity = "0";
          document.body.appendChild(temporary);
          temporary.select();
          const copied = document.execCommand("copy");
          temporary.remove();
          if (!copied) throw new Error("Clipboard copy was not available");
        }
        button.textContent = "Copied!";
      } catch (error) {
        button.textContent = "Copy failed";
      }
    });
    document.getElementById("start-over").addEventListener("click", () => {
      if (!confirm("Start a fresh retrospective? This will clear all saved responses.")) return;
      answers = blankAnswers();
      currentPage = 0;
      try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
      statusRight.textContent = "Responses cleared";
      renderPage();
    });
  }

  // The desktop shortcut opens the instructions screen before the retrospective.
})();
</script>
</body>
</html>

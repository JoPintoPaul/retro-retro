  button, input, textarea { font: inherit; }

  .desktop-label {
    position: fixed; left: 12px; bottom: 12px; color: white;
    text-shadow: 1px 1px #333; font-size: 12px;
  }
  .window {
    width: min(760px, 100%);
    margin: 0 auto;
    background: var(--chrome);
    border: 2px solid;
    border-color: var(--white) var(--dark-shadow) var(--dark-shadow) var(--white);
    box-shadow: 1px 1px 0 #000;
    padding: 3px;
  }
  .titlebar {
    min-height: 30px; padding: 4px 6px;
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; color: white; background: var(--navy);
    font-weight: bold;
  }
  .titlebar-name { display: flex; align-items: center; gap: 8px; }
  .app-icon {
    width: 18px; height: 18px; display: inline-grid; place-items: center;
    background: #c0c0c0; color: #000; border: 1px solid #fff;
    font-size: 12px; line-height: 1;
  }
  .window-controls { display: flex; gap: 3px; }
  .win-control {
    width: 21px; height: 20px; padding: 0; line-height: 15px;
    font-weight: bold; background: var(--chrome); border: 2px solid;
    border-color: var(--white) var(--dark-shadow) var(--dark-shadow) var(--white);
  }
  .menubar { display: flex; gap: 18px; padding: 7px 8px; font-size: 13px; }
  .content {
    background: #fff; border: 2px solid;
    border-color: var(--dark-shadow) var(--white) var(--white) var(--dark-shadow);
    padding: clamp(16px, 4vw, 28px);
    min-height: 390px;
  }
  .progress-wrap { margin: 0 0 22px; }
  .progress-meta {
    display: flex; justify-content: space-between; gap: 12px;
    margin-bottom: 7px; font-size: 12px;
  }
  .progress-track {
    height: 15px; padding: 2px; background: white;
    border: 1px solid var(--shadow);
    box-shadow: inset 1px 1px 0 var(--dark-shadow);
    display: flex; gap: 2px;
  }
  .progress-segment { flex: 1; background: #eee; }
  .progress-segment.done { background: #000080; }
  .page-kicker { color: #555; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  h1 { margin: 7px 0 12px; color: var(--navy); font-size: clamp(23px, 4vw, 30px); }
  .prompt { margin: 0 0 20px; line-height: 1.5; }
  .dialog {
    max-width: 590px; margin: 20px auto 0; background: var(--chrome);
    border: 2px solid; border-color: var(--white) var(--dark-shadow) var(--dark-shadow) var(--white);
    padding: 3px;
  }
  .dialog-title {
    background: var(--navy); color: white; font-weight: bold;
    padding: 6px 8px; display: flex; align-items: center; justify-content: space-between;
  }
  .dialog-body { padding: 17px 16px 14px; }
  .dialog-question { display: flex; align-items: center; gap: 13px; margin-bottom: 14px; }
  .dialog-symbol {
    flex: 0 0 42px; width: 42px; height: 42px; display: grid; place-items: center;
    border-radius: 50%; background: #e00000; color: white; font-size: 28px;
    font-family: Georgia, serif; font-weight: bold; border: 2px solid #800000;
    text-shadow: 1px 1px #700;
  }
  .dialog-symbol.good { background: #16852a; border-color: #075c18; }
  .dialog-symbol.info { background: #000080; border-color: #00004d; }
  .dialog-symbol.power { background: #e7e7e7; color: #000080; border-color: #777; }
  .dialog-question h2 { margin: 0; font-size: 19px; line-height: 1.25; }
  textarea, input[type="text"] {
    display: block; width: 100%; border: 2px solid;
    border-color: var(--dark-shadow) var(--white) var(--white) var(--dark-shadow);
    background: white; padding: 9px; min-height: 112px; resize: vertical;
    outline: none; color: #111;
  }
  input[type="text"] { min-height: 38px; }
  textarea:focus, input:focus { outline: 1px dotted #000; outline-offset: -5px; }

  .field-label { display: block; margin: 13px 0 6px; font-weight: bold; font-size: 12px; }
  .actions-list { display: grid; gap: 12px; }
  .action-entry { background: #eee; border: 1px solid #999; padding: 10px; }
  .action-entry label { display: block; margin-bottom: 6px; font-weight: bold; font-size: 12px; }
  .action-entry input { background: #fff; }
  .hint { color: #555; font-size: 12px; margin: 10px 0 0; }
  .nav-row {
    display: flex; justify-content: space-between; align-items: center;
    gap: 10px; margin-top: 24px; flex-wrap: wrap;
  }
  .button-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .win-button {
    min-width: 88px; padding: 7px 14px; background: var(--chrome);
    border: 2px solid; border-color: var(--white) var(--dark-shadow) var(--dark-shadow) var(--white);
    color: #000; cursor: pointer;
  }
  .win-button:active {
    border-color: var(--dark-shadow) var(--white) var(--white) var(--dark-shadow);
    padding: 8px 13px 6px 15px;
  }
  .win-button:focus { outline: 1px dotted #000; outline-offset: -5px; }
  .win-button.primary { font-weight: bold; }
  .win-button:disabled { color: #777; cursor: not-allowed; }
  .statusbar {
    display: flex; justify-content: space-between; gap: 10px;
    margin-top: 5px; padding: 5px 7px; font-size: 11px;
  }
  .status-cell {
    border: 1px solid; border-color: var(--shadow) var(--white) var(--white) var(--shadow);
    padding: 4px 7px; flex: 1;
  }
  .report h2 { color: var(--navy); border-bottom: 1px solid #999; padding-bottom: 6px; }
  .report-section { margin: 20px 0; }
  .report-section h3 { margin: 0 0 7px; color: #000080; }
  .report-section p { white-space: pre-wrap; line-height: 1.5; margin: 0; }
  .report-actions { padding-left: 22px; }
  .report-actions li { margin: 7px 0; }
  .empty { color: #777; font-style: italic; }
  .report-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
  .small-note { font-size: 11px; color: #555; }
  @media (max-width: 520px) {
    body { padding: 10px 8px 48px; }
    .content { min-height: 0; padding: 16px 12px; }
    .dialog-body { padding: 13px 10px 11px; }
    .dialog-question h2 { font-size: 17px; }
    .statusbar { flex-direction: column; }
  }
  @media print {
    body { background: white; padding: 0; font-family: Arial, sans-serif; }
    .window { width: 100%; border: 0; box-shadow: none; }
    .titlebar, .menubar, .progress-wrap, .nav-row, .statusbar, .desktop-label, .no-print { display: none !important; }
    .content { border: 0; padding: 0; }
    .report h2, .report-section h3 { color: #000; }
  }

  /* Windows XP Luna-inspired skin */
  :root {
    --chrome: #ece9d8;
    --navy: #1559b5;
    --shadow: #aca899;
    --dark-shadow: #716f64;
    --highlight: #ffffff;
  }
  body {
    font-family: Tahoma, Verdana, sans-serif;
    font-size: 13px;
  }
  .window {
    background: #ece9d8;
    border: 1px solid #0b3f8f;
    border-radius: 8px 8px 4px 4px;
    padding: 4px;
    box-shadow: 0 5px 18px rgba(0,0,0,.35);
    overflow: hidden;
  }
  .titlebar {
    min-height: 34px;
    padding: 6px 8px 7px 10px;
    border-radius: 5px 5px 0 0;
    background: linear-gradient(180deg, #3b8cf4 0%, #1769d2 18%, #0752b8 55%, #0c3f9b 100%);
    text-shadow: 1px 1px 2px #123c79;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.65);
  }
  .app-icon {
    border: 1px solid #dceaff;
    border-radius: 3px;
    box-shadow: 0 1px 2px rgba(0,0,0,.35);
  }
  .window-controls { gap: 2px; }
  .win-control {
    width: 23px;
    height: 22px;
    border: 1px solid #fff;
    border-radius: 4px;
    color: white;
    background: linear-gradient(180deg, #7eb7f7, #2368c9 55%, #12479e);
    box-shadow: inset 0 1px 1px rgba(255,255,255,.7), 0 1px 1px rgba(0,0,0,.25);
    text-shadow: 0 1px #17488b;
  }
  .win-control:last-child {
    background: linear-gradient(180deg, #f5a08f, #e34b35 55%, #b51d16);
  }
  .menubar {
    padding: 8px 10px;
    background: #ece9d8;
    color: #222;
    border-bottom: 1px solid #c9c6b8;
  }
  .content {
    background: #fff;
    border: 1px solid #9c9a8c;
    border-radius: 3px;
    padding: clamp(16px, 4vw, 28px);
    box-shadow: inset 0 1px 2px rgba(0,0,0,.08);
  }
  .progress-track {
    height: 16px;
    border: 1px solid #8e8d82;
    border-radius: 3px;
    background: #fff;
    box-shadow: inset 1px 1px 2px rgba(0,0,0,.18);
    overflow: hidden;
  }
  .progress-segment { background: #e8e8e8; }
  .progress-segment.done {
    background: linear-gradient(180deg, #79c5ff 0%, #1684df 48%, #0860b9 100%);
    border-radius: 1px;
  }
  .page-kicker { color: #666; }
  h1 { color: #1456a5; }
  .dialog {
    background: #ece9d8;
    border: 1px solid #8e9db5;
    border-radius: 6px;
    padding: 4px;
    box-shadow: 0 2px 7px rgba(0,0,0,.16);
  }
  .dialog-title {
    padding: 7px 10px;
    border-radius: 3px 3px 0 0;
    background: linear-gradient(180deg, #4b9bf5 0%, #2377df 18%, #125bc3 62%, #0c469f 100%);
    color: #fff;
    text-shadow: 1px 1px 2px #16447e;
  }
  .dialog-body { padding: 17px 16px 14px; }
  .dialog-symbol {
    box-shadow: 0 1px 3px rgba(0,0,0,.25);
  }
  .dialog-symbol.info {
    background: linear-gradient(145deg, #4a9bea, #064b9f);
    border-color: #073b7a;
  }
  textarea, input[type="text"] {
    border: 1px solid #7f9db9;
    border-radius: 2px;
    box-shadow: inset 1px 1px 2px rgba(0,0,0,.16);
    padding: 9px;
    font-family: Tahoma, Verdana, sans-serif;
  }
  textarea:focus, input:focus {
    outline: 1px solid #316ac5;
    outline-offset: 0;
  }
  .action-entry {
    background: #f4f2e9;
    border: 1px solid #c5c2b5;
    border-radius: 4px;
  }
  .win-button {
    min-width: 88px;
    padding: 7px 15px;
    border: 1px solid #003c74;
    border-radius: 4px;
    background: linear-gradient(180deg, #fff 0%, #e8f2fc 10%, #c7def5 48%, #9fc4ec 50%, #d7e8f8 100%);
    color: #123e70;
    text-shadow: 0 1px rgba(255,255,255,.9);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.9), 0 1px 2px rgba(0,0,0,.16);
  }
  .win-button:hover:not(:disabled) {
    background: linear-gradient(180deg, #fff8dc 0%, #fff0b8 48%, #ffda70 50%, #ffedb5 100%);
    border-color: #c28b22;
  }
  .win-button:active {
    background: linear-gradient(180deg, #b7d2ee, #e4f0fb);
    border-color: #315f91;
    padding: 8px 14px 6px 16px;
    box-shadow: inset 1px 1px 2px rgba(0,0,0,.2);
  }
  .win-button:focus { outline: 1px dotted #164b82; outline-offset: -4px; }
  .win-button:disabled {
    color: #999;
    border-color: #b9b6a8;
    background: #e5e3da;
    box-shadow: none;
  }
  .statusbar { color: #333; }
  .status-cell {
    border: 1px solid #c5c2b5;
    border-radius: 2px;
    background: #f4f2e9;
  }
  .report h2, .report-section h3 { color: #1456a5; }
  @media print {
    .window { border-radius: 0; }
    .content { border: 0; box-shadow: none; }
  }


  /* Windows XP desktop shortcut / launch screen */
  .window { display: none; }
  .window.launched { display: block; }
  .desktop-launcher {
    position: absolute;
    top: 34px;
    left: 30px;
    width: 104px;
    min-height: 100px;
    padding: 8px 5px;
    border: 1px solid transparent;
    border-radius: 3px;
    background: transparent;
    color: #fff;
    font: 12px Tahoma, Verdana, sans-serif;
    text-align: center;
    text-shadow: 1px 1px 2px #183d70, -1px -1px 1px #183d70;
    cursor: pointer;
  }
  .desktop-launcher:hover,
  .desktop-launcher:focus-visible {
    outline: 1px dotted rgba(255,255,255,.95);
    background: rgba(35, 91, 160, .28);
  }
  .desktop-launcher:active { background: rgba(35, 91, 160, .48); }
  .desktop-icon {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 48px;
    height: 48px;
    margin: 0 auto 7px;
    border: 1px solid rgba(255,255,255,.9);
    border-radius: 7px;
    background: linear-gradient(145deg, #e9f6ff 0%, #76b8ed 42%, #1763b8 100%);
    box-shadow: 1px 2px 4px rgba(0,0,0,.45), inset 1px 1px 2px rgba(255,255,255,.9);
  }
  .desktop-icon svg { width: 38px; height: 38px; filter: drop-shadow(1px 1px 1px rgba(0,0,0,.35)); }
  .desktop-launcher-label {
    display: block;
    line-height: 1.25;
    overflow-wrap: anywhere;
  }
  .desktop-hint {
    position: absolute;
    left: 30px;
    top: 151px;
    color: #fff;
    font: 11px Tahoma, Verdana, sans-serif;
    text-shadow: 1px 1px 2px #183d70;
    opacity: .92;
    pointer-events: none;
  }
  @media (max-width: 600px) {
    .desktop-launcher { top: 18px; left: 14px; }
    .desktop-hint { top: 135px; left: 14px; }
  }
  @media print {
    .desktop-launcher, .desktop-hint { display: none !important; }
    .window { display: block !important; }
  }

</style>
</head>
<body>
<button class="desktop-launcher" id="launch-retro" type="button" aria-label="Start Retro Manager.exe">
  <span class="desktop-icon" aria-hidden="true">
    <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
      <path d="M7 9h34v24H7z" fill="#eaf6ff" stroke="#174b83" stroke-width="2"/>
      <path d="M10 12h28v17H10z" fill="#1676c9"/>
      <path d="M12 14h7v6h-7z" fill="#f04b3a"/>
      <path d="M21 14h7v6h-7z" fill="#f5c928"/>
      <path d="M30 14h6v6h-6z" fill="#35a852"/>
      <path d="M12 22h7v5h-7z" fill="#35a852"/>
      <path d="M21 22h7v5h-7z" fill="#f04b3a"/>
      <path d="M30 22h6v5h-6z" fill="#f5c928"/>
      <path d="M20 33h8v5h-8z" fill="#d9e7f5" stroke="#174b83" stroke-width="1"/>
      <path d="M15 39h18" stroke="#174b83" stroke-width="2" stroke-linecap="round"/>
    </svg>
  </span>
  <span class="desktop-launcher-label">Retro Manager.exe</span>
</button>
<div class="desktop-hint" id="desktop-hint">Double-click to start</div>

<div class="window" id="retro-window" role="application" aria-label="Retro Manager retrospective">
  <div class="titlebar">
    <div class="titlebar-name"><span class="app-icon">▣</span><span>Retro Manager.exe</span></div>
    <div class="window-controls" aria-hidden="true">
      <button class="win-control" tabindex="-1">_</button>
      <button class="win-control" tabindex="-1">□</button>
      <button class="win-control" tabindex="-1">×</button>
    </div>
  </div>
  <div class="menubar"><span>File</span><span>Edit</span><span>View</span><span>Help</span></div>
  <main class="content" id="app"></main>
  <div class="statusbar">
    <div class="status-cell" id="status-left">Ready</div>
    <div class="status-cell" id="status-right">Responses saved in this browser</div>
  </div>
</div>


<script>
(() => {
  const STORAGE_KEY = "retroManagerRetrospective_v1";
  const pages = [
    {
      id: "error-message",
      windowTitle: "System Error",
      title: "System Error",
      question: "If the last month were a Windows error message, what would it say?",
      placeholder: "Type your error message here...",
      symbol: "×",
      symbolClass: ""
    },
    {
      id: "successful-downloads",
      windowTitle: "Download Complete",
      title: "Successful Downloads",
      question: "What went well over the last month? What did we achieve?",
      placeholder: "List your successes here...",
      symbol: "✓",
      symbolClass: "good"
    },
    {
      id: "system-errors",
      windowTitle: "Application Error",
      title: "System Errors",
      question: "What went wrong? What caused frustration?",
      placeholder: "Describe the errors here...",
      symbol: "×",
      symbolClass: ""
    },
    {
      id: "system-upgrades",
      windowTitle: "Windows Update",
      title: "System Upgrades",
      question: "What could we improve? What processes need an upgrade?",
      placeholder: "Suggest your upgrades here...",
      symbol: "⚙",
      symbolClass: "info"
    },
    {
      id: "next-version",
      windowTitle: "Software Update Wizard",
      title: "Next Version",
      question: "What are some specific actions before the end of 2026?",
      type: "actions",
      symbol: "▣",
      symbolClass: "info"
    },
    {
      id: "shut-down",
      windowTitle: "Shut Down Windows",
      title: "Shut Down",
      question: "A word or sentence to describe how you feel about the sprint.",
      placeholder: "How are you feeling?",
      symbol: "⏻",
      symbolClass: "power"
    }
  ];

  const blankAnswers = () => ({
    "error-message": "",
    "successful-downloads": "",
    "system-errors": "",
    "system-upgrades": "",
    "next-version": ["", "", ""],
    "shut-down": ""
  });

  let answers = blankAnswers();
  let currentPage = 0;

  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
    if (saved && saved.answers) {
      answers = { ...blankAnswers(), ...saved.answers };
      if (!Array.isArray(answers["next-version"])) answers["next-version"] = ["", "", ""];
      answers["next-version"] = [0,1,2].map(i => answers["next-version"][i] || "");
    }
  } catch (e) {
    // If browser storage is unavailable or contains invalid data, the form still works in memory.
  }

  const app = document.getElementById("app");
  const retroWindow = document.getElementById("retro-window");
  const launcher = document.getElementById("launch-retro");
  const desktopHint = document.getElementById("desktop-hint");
  launcher.addEventListener("click", () => {
    retroWindow.classList.add("launched");
    launcher.hidden = true;
    desktopHint.hidden = true;
  });
  const statusLeft = document.getElementById("status-left");
  const statusRight = document.getElementById("status-right");

  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ answers, savedAt: new Date().toISOString() }));
      statusRight.textContent = "All changes saved";
    } catch (e) {
      statusRight.textContent = "Storage unavailable — keep this tab open";
    }
  }

  function escapeHtml(value) {
    return String(value).replace(/[&<>"']/g, ch => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[ch]));
  }

  function progressMarkup(index) {
    return `
      <div class="progress-wrap">
        <div class="progress-meta"><span>RETROSPECTIVE PROGRESS</span><span>${index + 1} of ${pages.length + 1}</span></div>
        <div class="progress-track" aria-label="Progress">
          ${pages.map((_, i) => `<span class="progress-segment ${i <= index ? "done" : ""}"></span>`).join("")}
          <span class="progress-segment"></span>
        </div>
      </div>`;
  }

  function renderPage() {
    const page = pages[currentPage];
    statusLeft.textContent = `Page ${currentPage + 1}: ${page.title}`;
    app.innerHTML = `
      ${progressMarkup(currentPage)}
      <div class="page-kicker">Retrospective · ${String(currentPage + 1).padStart(2, "0")}</div>
      <section class="dialog" aria-labelledby="page-title">
        <div class="dialog-title"><span>${page.windowTitle}</span><span aria-hidden="true">×</span></div>
        <div class="dialog-body">
          <div class="dialog-question">
            <div class="dialog-symbol ${page.symbolClass}" aria-hidden="true">${page.symbol}</div>
            <h2 id="page-title">${page.title}</h2>
          </div>
          <p class="prompt">${page.question}</p>
          <div class="input-column">
              ${page.type === "actions" ? renderActions() : `
                <label class="field-label" for="answer-field">YOUR RESPONSE</label>
                <textarea id="answer-field" placeholder="${page.placeholder}">${escapeHtml(answers[page.id] || "")}</textarea>
              `}
              ${page.type === "actions" ? '<p class="hint">Add up to three actions. You can leave any field blank.</p>' : '<p class="hint">Your response is saved automatically in this browser.</p>'}
          </div>
        </div>
      </section>
      <div class="nav-row">
        <button class="win-button" id="back-button" ${currentPage === 0 ? "disabled" : ""}>‹ Back</button>
        <div class="button-row">
          <button class="win-button" id="clear-page">Clear page</button>
          <button class="win-button primary" id="next-button">${currentPage === pages.length - 1 ? "View report »" : "Next »"}</button>
        </div>
      </div>
    `;

    if (page.type === "actions") {
      document.querySelectorAll("[data-action-index]").forEach(input => {
        input.addEventListener("input", event => {
          answers["next-version"][Number(event.target.dataset.actionIndex)] = event.target.value;
          save();
        });
      });
    } else {
      document.getElementById("answer-field").addEventListener("input", event => {
        answers[page.id] = event.target.value;
        save();
      });
    }

    document.getElementById("back-button").addEventListener("click", () => {
      if (currentPage > 0) { currentPage--; renderPage(); }
    });
    document.getElementById("next-button").addEventListener("click", () => {
      save();
      if (currentPage < pages.length - 1) { currentPage++; renderPage(); }
      else renderReport();
    });
    document.getElementById("clear-page").addEventListener("click", () => {
      if (!confirm("Clear the responses on this page?")) return;
      if (page.type === "actions") answers["next-version"] = ["", "", ""];
      else answers[page.id] = "";
      save();
      renderPage();
    });
  }

  function renderActions() {
    return `<div class="actions-list">
      ${[0,1,2].map(i => `
        <div class="action-entry">
          <label for="action-${i}">ACTION ${i + 1}</label>
          <input type="text" id="action-${i}" data-action-index="${i}" maxlength="240"
            placeholder="Enter action..." value="${escapeHtml(answers["next-version"][i])}">
        </div>`).join("")}
    </div>`;
  }

  function renderReport() {
    save();
    statusLeft.textContent = "Retrospective report";
    const sections = pages.map(page => {
      let body;
      if (page.type === "actions") {
        const items = answers["next-version"].map(s => s.trim()).filter(Boolean);
        body = items.length
          ? `<ol class="report-actions">${items.map(item => `<li>${escapeHtml(item)}</li>`).join("")}</ol>`
          : '<p class="empty">No actions entered.</p>';
      } else {
        const value = (answers[page.id] || "").trim();
        body = value ? `<p>${escapeHtml(value)}</p>` : '<p class="empty">No response entered.</p>';
      }
      return `<section class="report-section"><h3>${page.title}</h3>${body}</section>`;
    }).join("");

    app.innerHTML = `
      ${progressMarkup(pages.length)}
      <div class="report">
        <div class="report-top">
          <div><div class="page-kicker">RETRO MANAGER · SUMMARY</div><h1>Retrospective Report</h1>
          <p class="small-note">Generated ${new Date().toLocaleString()}</p></div>
          <div class="button-row no-print">
            <button class="win-button" id="edit-answers">‹ Edit answers</button>
            <button class="win-button primary" id="print-report">Print / Save PDF</button>
          </div>
        </div>
        ${sections}
        <div class="nav-row no-print">
          <button class="win-button" id="start-over">Start again</button>
          <span class="small-note">Your responses remain saved in this browser until cleared.</span>
        </div>
      </div>`;

    document.getElementById("edit-answers").addEventListener("click", () => {
      currentPage = 0;
      renderPage();
    });
    document.getElementById("print-report").addEventListener("click", () => window.print());
    document.getElementById("start-over").addEventListener("click", () => {
      if (!confirm("Start a fresh retrospective? This will clear all saved responses.")) return;
      answers = blankAnswers();
      currentPage = 0;
      try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
      statusRight.textContent = "Responses cleared";
      renderPage();
    });
  }

  renderPage();
})();
</script>
</body>
</html>
